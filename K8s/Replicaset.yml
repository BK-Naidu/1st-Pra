apiVersion: apps/v1
kind: ReplicaSet
meatadata:
  name: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template: # Pod Template
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx-container
      imge: nginx
      ports:
      - containerPort: 80

